[project]
name = "redmine-mcp"
version = "0.1.0"
description = "セルフホスト Redmine を Claude から操作する MCP サーバー(stdio)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dokkiitech" }]
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
redmine-mcp = "redmine_mcp.server:main"

[project.urls]
Repository = "https://github.com/dokkiitech/redmine-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redmine_mcp"]
